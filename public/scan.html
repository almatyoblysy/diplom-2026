<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дипломды QR арқылы тексеру</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      text-align: center;
      padding: 25px 15px;
    }
    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px #0001;
    }
    h2 { color: #0a3d62; }
    #reader { margin-top: 20px; }
    input {
      width: 90%;
      padding: 12px;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 12px 22px;
      margin-top: 12px;
      background: #0a3d62;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    #status { margin-top: 15px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🏆 Дипломды тексеру</h2>
    <p>Бұрын берілген дипломның QR-кодын сканерлеңіз</p>

    <div id="reader"></div>

    <p id="status">Камераны іске қосыңыз</p>

    <input id="manual" placeholder="QR сілтемесін осында қойыңыз">
    <br>
    <button onclick="openOldQR(document.getElementById('manual').value)">
      Тексеру
    </button>
  </div>

  <script>
    const NEW_URL =
      "https://script.google.com/macros/s/AKfycbyqhZ00vStSKMSgisUyDOdTLRSf6Y5po50Dt2r7hCeRmcknmJNsfMOrYmadWJgCqiBA/exec";

    function openOldQR(value) {
      try {
        const url = new URL(value.trim());
        const sheet = url.searchParams.get("sheet");
        const reg = url.searchParams.get("reg");

        if (!sheet || !reg) {
          throw new Error("QR сілтемесінде sheet немесе reg жоқ");
        }

        const target = new URL(NEW_URL);
        target.searchParams.set("sheet", sheet);
        target.searchParams.set("reg", reg);

        document.getElementById("status").innerText =
          "Диплом ашылуда...";

        window.location.href = target.toString();
      } catch (e) {
        document.getElementById("status").innerText =
          "Қате: QR сілтемесін тексеріңіз.";
      }
    }

    function onScanSuccess(decodedText) {
      openOldQR(decodedText);
    }

    const scanner = new Html5QrcodeScanner("reader", {
      fps: 10,
      qrbox: { width: 250, height: 250 }
    });

    scanner.render(onScanSuccess);
  </script>
</body>
</html>

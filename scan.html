<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дипломды QR арқылы тексеру</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 15px;
  background: #f4f6f8;
}
h2 { color: #123b5d; }
button {
  padding: 13px 20px;
  margin: 8px;
  border: none;
  border-radius: 8px;
  background: #123b5d;
  color: white;
  font-size: 16px;
}
input {
  width: 90%;
  padding: 12px;
  margin: 10px 0;
}
#reader {
  max-width: 450px;
  margin: 15px auto;
}
</style>
</head>
<body>

<h2>Дипломды QR арқылы тексеру</h2>
<p>QR-кодты камераға көрсетіңіз</p>

<div id="reader"></div>

<button onclick="switchCamera()">🔄 Камераны ауыстыру</button>

<hr>

<p>Немесе QR сілтемесін осында енгізіңіз:</p>
<input id="manual" placeholder="QR сілтемесін қойыңыз">
<br>
<button onclick="openOldQR(document.getElementById('manual').value)">
Тексеру
</button>

<script>
const NEW_URL = "https://script.google.com/macros/s/AKfycbyqhZ00vStSKMSgisUyDOdTLRSf6Y5po50Dt2r7hCeRmcknmJNsfMOrYmadWJgCqiBA/exec";

let html5QrCode;
let cameras = [];
let currentCamera = 0;
let isScanning = false;

function openOldQR(value) {
  try {
    const url = new URL(value.trim());
    const sheet = url.searchParams.get("sheet");
    const reg = url.searchParams.get("reg");

    if (!sheet || !reg) {
      alert("QR сілтемесі дұрыс емес!");
      return;
    }

    const target = new URL(NEW_URL);
    target.searchParams.set("sheet", sheet);
    target.searchParams.set("reg", reg);
    window.location.href = target.toString();

  } catch (e) {
    alert("Сілтемені дұрыс енгізіңіз!");
  }
}

function onScanSuccess(decodedText) {
  if (!isScanning) return;
  isScanning = false;

  html5QrCode.stop().then(() => {
    openOldQR(decodedText);
  }).catch(() => {
    openOldQR(decodedText);
  });
}

async function startCamera(index) {
  if (isScanning) {
    await html5QrCode.stop();
    isScanning = false;
  }

  currentCamera = index;

  try {
    await html5QrCode.start(
      cameras[currentCamera].id,
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScanSuccess
    );
    isScanning = true;
  } catch (err) {
    alert("Камераны қосу мүмкін болмады. Рұқсат беріңіз.");
  }
}

async function switchCamera() {
  if (cameras.length < 2) {
    alert("Басқа камера табылмады.");
    return;
  }

  let next = (currentCamera + 1) % cameras.length;
  await startCamera(next);
}

async function initScanner() {
  html5QrCode = new Html5Qrcode("reader");

  try {
    cameras = await Html5Qrcode.getCameras();

    if (!cameras.length) {
      alert("Камера табылмады!");
      return;
    }

    let backCamera = cameras.findIndex(camera =>
      /back|rear|environment|арткы|задн/i.test(camera.label)
    );

    await startCamera(backCamera >= 0 ? backCamera : cameras.length - 1);

  } catch (err) {
    alert("Камераға рұқсат беріңіз немесе телефон баптауын тексеріңіз.");
  }
}

initScanner();
</script>

</body>
</html>
